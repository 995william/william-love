<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Auth By William 字体颜色 5 套高级方案实时预览工坊</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Montserrat', -apple-system, sans-serif;
      user-select: none;
      transition: background-color 0.5s ease;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .interactive {
      pointer-events: auto;
    }

    /* 方案 1：晶莹星钻金白 */
    .glow-scheme-1 {
      background: linear-gradient(135deg, #ffffff 0%, #fff6d6 50%, #ffe58f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 22px rgba(255, 229, 143, 0.75)) drop-shadow(0 0 35px rgba(145, 213, 255, 0.5));
    }

    /* 方案 2：赛博电光青紫 */
    .glow-scheme-2 {
      background: linear-gradient(90deg, #00f2fe, #4facfe, #7f00ff, #00f2fe);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 3s ease infinite;
      filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.75)) drop-shadow(0 0 40px rgba(127, 0, 255, 0.55));
    }

    /* 方案 3：落日晚霞珊瑚粉 */
    .glow-scheme-3 {
      background: linear-gradient(90deg, #ff7a45, #ff4d4f, #ff85c0, #ff7a45);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 3.5s ease-in-out infinite;
      filter: drop-shadow(0 0 25px rgba(255, 77, 79, 0.75)) drop-shadow(0 0 35px rgba(255, 133, 192, 0.5));
    }

    /* 方案 4：极简极客冷月白 */
    .glow-scheme-4 {
      color: #ffffff;
      -webkit-text-fill-color: #ffffff;
      filter: drop-shadow(0 0 20px rgba(230, 247, 255, 0.9)) drop-shadow(0 0 35px rgba(186, 231, 255, 0.6));
    }

    /* 方案 5：星河全彩极光 */
    .glow-scheme-5 {
      background: linear-gradient(90deg, #00f2fe, #00ff88, #ffd700, #ff007f, #7f00ff, #00f2fe);
      background-size: 400% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 4s linear infinite;
      filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.6)) drop-shadow(0 0 35px rgba(255, 0, 127, 0.55));
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 缓动浮现升腾 */
    @keyframes riseIn {
      0% { transform: translateY(22px); opacity: 0; filter: blur(4px); }
      100% { transform: translateY(0); opacity: 1; filter: blur(0); }
    }

    .rise-in {
      animation: riseIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#080810]" id="appBody">

  <canvas id="fireworksCanvas"></canvas>

  <div class="ui-container">
    <!-- 顶部控制台 -->
    <div class="interactive w-full max-w-4xl bg-slate-900/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-4 shadow-2xl flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></span>
          <h2 class="text-white font-bold text-sm tracking-wide">✨ Auth By William 字体颜色多方案体验工坊</h2>
        </div>
        <!-- 背景模拟切换 -->
        <div class="flex items-center gap-2 text-xs text-slate-300">
          <span>模拟底色：</span>
          <button onclick="changeBg('#080810')" class="px-2.5 py-1 rounded bg-slate-800 border border-slate-600 hover:bg-slate-700">深色夜空</button>
          <button onclick="changeBg('#1e293b')" class="px-2.5 py-1 rounded bg-slate-800 border border-slate-600 hover:bg-slate-700">深蓝壁纸</button>
          <button onclick="changeBg('#f1f5f9')" class="px-2.5 py-1 rounded bg-slate-800 border border-slate-600 hover:bg-slate-700 text-slate-200">浅色桌面</button>
        </div>
      </div>

      <!-- 方案切换按钮组 -->
      <div class="grid grid-cols-5 gap-2">
        <button id="btn1" onclick="selectScheme(1)" class="scheme-btn py-2 px-3 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition-all bg-blue-600 border-blue-400 text-white shadow-lg shadow-blue-500/30">
          <span>方案 1 (推荐)</span>
          <span class="text-[10px] opacity-80">晶莹星钻金白</span>
        </button>
        <button id="btn2" onclick="selectScheme(2)" class="scheme-btn py-2 px-3 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition-all bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700/60">
          <span>方案 2</span>
          <span class="text-[10px] opacity-80">赛博电光青紫</span>
        </button>
        <button id="btn3" onclick="selectScheme(3)" class="scheme-btn py-2 px-3 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition-all bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700/60">
          <span>方案 3</span>
          <span class="text-[10px] opacity-80">落日晚霞珊瑚</span>
        </button>
        <button id="btn4" onclick="selectScheme(4)" class="scheme-btn py-2 px-3 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition-all bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700/60">
          <span>方案 4</span>
          <span class="text-[10px] opacity-80">极简冷月纯白</span>
        </button>
        <button id="btn5" onclick="selectScheme(5)" class="scheme-btn py-2 px-3 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition-all bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700/60">
          <span>方案 5</span>
          <span class="text-[10px] opacity-80">星河极光全彩</span>
        </button>
      </div>

      <!-- 方案说明文本 -->
      <div class="text-xs text-amber-300 font-medium px-1 flex items-center gap-1.5" id="schemeDesc">
        💡 当前：方案 1 —— 纯净冰白钻石光泽 + 璀璨淡香槟金，清透高贵，任何背景下均极度清晰夺目！
      </div>
    </div>

    <!-- 中央核心文字展示区 -->
    <div class="flex-1 flex flex-col justify-center items-center text-center my-auto rise-in" id="centerTextWrapper">
      <div class="text-xs sm:text-sm font-bold tracking-[0.25em] mb-3 uppercase" id="subtitleText" style="color: #FFF1B8;">
        ✦ SPECIAL DEDICATION & PRODUCTION ✦
      </div>

      <div class="relative py-2 px-6">
        <h1 id="mainTitle" class="glow-scheme-1 font-black text-5xl sm:text-7xl md:text-8xl tracking-tight transition-all duration-300" style="font-family: 'Segoe UI Black', Impact, sans-serif;">
          Auth By William
        </h1>
      </div>

      <div class="text-sm sm:text-base tracking-widest mt-4 font-semibold" id="quoteText" style="color: #FFFFFF;">
        “ 始于心动 · 终于白首 · 岁岁年年 ”
      </div>
    </div>

    <!-- 底部操作提示 -->
    <div class="text-xs text-slate-400 font-mono tracking-wider pb-2">
      提示：您可以直接在上方点击切换，或运行根目录下的 <span class="text-amber-400 font-bold">预览字体颜色方案.bat</span> 在真实透明桌面上实时按 1~5 键体验！
    </div>
  </div>

  <script>
    const schemes = {
      1: {
        name: "方案 1 (推荐)：晶莹星钻金白 (Diamond Ice Gold)",
        desc: "💡 当前：方案 1 —— 纯净冰白钻石光泽 + 璀璨淡香槟金，清透高贵，任何背景下均极度清晰夺目！",
        subColor: "#FFF1B8",
        quoteColor: "#FFFFFF",
        className: "glow-scheme-1"
      },
      2: {
        name: "方案 2：赛博电光青紫 (Cyber Neon Azure & Violet)",
        desc: "💡 当前：方案 2 —— 高饱和电光湖蓝向极光深紫流转，未来科技感与炸裂感兼备！",
        subColor: "#00F2FE",
        quoteColor: "#E0E7FF",
        className: "glow-scheme-2"
      },
      3: {
        name: "方案 3：落日晚霞珊瑚粉 (Sunset Rose & Coral Glow)",
        desc: "💡 当前：方案 3 —— 日落橙红与心动珊瑚粉相映，暖调深情，浪漫温柔而有温度！",
        subColor: "#FFD8BF",
        quoteColor: "#FFF0F6",
        className: "glow-scheme-3"
      },
      4: {
        name: "方案 4：极简极客冷月白 (Minimal Pure White Blade)",
        desc: "💡 当前：方案 4 —— 100% 极纯高亮白，不带任何杂色，至简至奢华，高冷大气！",
        subColor: "#D9D9D9",
        quoteColor: "#FFFFFF",
        className: "glow-scheme-4"
      },
      5: {
        name: "方案 5：星河全彩极光幻彩 (Cosmic Rainbow Aurora)",
        desc: "💡 当前：方案 5 —— 全光谱色相动态流转，青蓝、翡翠绿、金黄、粉紫交织曼舞！",
        subColor: "#FFD700",
        quoteColor: "#FFFFFF",
        className: "glow-scheme-5"
      }
    };

    function selectScheme(id) {
      const sch = schemes[id];
      const title = document.getElementById("mainTitle");
      const desc = document.getElementById("schemeDesc");
      const sub = document.getElementById("subtitleText");
      const quote = document.getElementById("quoteText");

      // 切换样式类名
      title.className = `font-black text-5xl sm:text-7xl md:text-8xl tracking-tight transition-all duration-300 ${sch.className}`;
      desc.textContent = sch.desc;
      sub.style.color = sch.subColor;
      quote.style.color = sch.quoteColor;

      // 按钮高亮更新
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`btn${i}`);
        if (i === id) {
          btn.className = "scheme-btn py-2 px-3 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition-all bg-blue-600 border-blue-400 text-white shadow-lg shadow-blue-500/30";
        } else {
          btn.className = "scheme-btn py-2 px-3 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition-all bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700/60";
        }
      }
    }

    function changeBg(color) {
      document.getElementById("appBody").style.backgroundColor = color;
      const quote = document.getElementById("quoteText");
      const sub = document.getElementById("subtitleText");
      if (color === '#f1f5f9') {
        quote.style.color = '#0f172a';
        sub.style.color = '#334155';
      } else {
        const curId = Object.keys(schemes).find(k => document.getElementById(`btn${k}`).classList.contains('bg-blue-600')) || 1;
        quote.style.color = schemes[curId].quoteColor;
        sub.style.color = schemes[curId].subColor;
      }
    }

    // 60FPS 绚丽烟花 Canvas 物理仿真引擎
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const rockets = [];
    const colors = ['#ffd700', '#ffe082', '#ff4081', '#00e5ff', '#ffffff', '#ff1744'];

    class Rocket {
      constructor() {
        this.x = Math.random() * width * 0.7 + width * 0.15;
        this.y = height + 10;
        this.targetY = Math.random() * height * 0.38 + height * 0.10;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = -(Math.random() * 5 + 14);
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.isHeart = Math.random() > 0.45;
        this.exploded = false;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.y <= this.targetY || this.vy >= 0) {
          this.exploded = true;
          this.explode();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
      explode() {
        const count = this.isHeart ? 70 : 50;
        for (let i = 0; i < count; i++) {
          particles.push(new Particle(this.x, this.y, this.color, this.isHeart));
        }
      }
    }

    class Particle {
      constructor(x, y, color, isHeart) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.alpha = 1.0;
        this.decay = Math.random() * 0.015 + 0.012;
        this.size = Math.random() * 2.2 + 2.0;

        if (isHeart) {
          const t = Math.random() * Math.PI * 2;
          const r = Math.random() * 0.9 + 0.8;
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
          this.vx = (hx / 16) * r * 3.8;
          this.vy = (hy / 16) * r * 3.8;
        } else {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 7 + 2.5;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
        }
      }
      update() {
        this.vx *= 0.96;
        this.vy *= 0.96;
        this.vy += 0.06;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    let frame = 0;
    function loop() {
      frame++;
      ctx.clearRect(0, 0, width, height);

      if (frame % 20 === 0) {
        rockets.push(new Rocket());
      }

      for (let i = rockets.length - 1; i >= 0; i--) {
        rockets[i].update();
        rockets[i].draw();
        if (rockets[i].exploded) rockets.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
